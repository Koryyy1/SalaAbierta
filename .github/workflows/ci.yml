# Integración continua: en cada push y Pull Request se revisa el código y se ejecutan las pruebas
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Pruebas
        run: npm test 2>&1 | tee pruebas.log
        shell: bash -o pipefail {0}
      # Si alguna prueba falla, resume el error como anotación visible en la pestaña Checks del PR
      - name: Resumen de pruebas fallidas
        if: failure()
        run: |
          resumen=$(grep -E -A12 "^ *not ok|AssertionError|Error:" pruebas.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Pruebas fallidas::${resumen}"

  frontend:
    name: Frontend · revisión de tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (no npm ci) para aceptar dependencias nuevas aunque el package-lock se actualice después
      - run: npm install --no-audit --no-fund
      # Expo genera este archivo al iniciar la app (no se versiona); declara los tipos de archivos .css
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit

  docker:
    name: Docker · construcción y prueba de humo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Variables de prueba
        run: |
          printf 'DOMINIO=:80\nDB_PASSWORD=prueba-ci\nJWT_SECRET=secreto-solo-para-ci-0123456789\n' > .env
      - name: Construir imágenes
        run: docker compose build
      - name: Levantar base de datos, API y web
        run: docker compose up -d db api web
      - name: Comprobar la web y la API a través de Caddy
        run: |
          for i in $(seq 1 45); do
            curl -fsS http://localhost/api/holamundo && break
            sleep 2
          done
          curl -fsS http://localhost/api/holamundo | grep -q OK
          curl -fsS http://localhost/ | grep -qi '<html'
          # Inicio de sesión con un usuario de prueba, como lo haría la web (mismo sitio)
          curl -fsS -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost' \
            -d '{"email":"profesor@salaabierta.cl","password":"profesor123"}' | grep -q token
      - name: Registros si falla
        if: failure()
        run: docker compose logs --no-color | tail -100
      - run: docker compose down -v
        if: always()
